<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlankerC</title>
<meta name="description" content="FlankerC - small, simple Android utility apps.">
<style>
  :root { --bg:#f8fafc; --fg:#0f172a; --muted:#475569; --accent:#1565c0; --card:#fff; --line:#e2e8f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1218; --fg:#e3e8f0; --muted:#a6b0c0; --accent:#90caf9; --card:#161c26; --line:#2a3342; }
  }
  body { margin:0; font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:2rem; margin:0 0 4px; }
  p.tag { color:var(--muted); margin:0 0 32px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .card h2 { margin:0 0 6px; font-size:1.2rem; }
  a { color:var(--accent); }
  footer { margin-top:32px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>FlankerC</h1>
  <p class="tag">Small, simple Android utility apps.</p>

  <section class="card">
    <h2>Speaker Cleaner: Water &amp; Dust</h2>
    <p>Plays generated sound tones that help push water and dust out of your phone speaker.
       It is a helper only and does not replace hardware repair.</p>
    <p><a href="privacy.html">Privacy Policy</a></p>
  </section>

  <footer>
    <p>Contact: <a href="mailto:hqdaingoc@gmail.com">hqdaingoc@gmail.com</a></p>
  </footer>
</main>
